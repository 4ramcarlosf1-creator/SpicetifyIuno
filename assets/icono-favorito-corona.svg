<svg width="20" height="20" viewBox="0 0 44 46" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Corona cristalina inspirada en Furina -->

  <!-- Sombra/resplandor base -->
  <ellipse cx="22" cy="42" rx="14" ry="3" fill="#5961CE" opacity="0.25"/>

  <!-- Cuerpo principal de la corona -->
  <path d="M6 38 L6 28 L2 14 L11 22 L22 8 L33 22 L42 14 L38 28 L38 38 Z"
        fill="#BAC0F2" opacity="0.85"/>

  <!-- Facetas internas — efecto cristal -->
  <path d="M6 38 L6 28 L11 22 L22 30 Z" fill="#7B84E8" opacity="0.6"/>
  <path d="M38 38 L38 28 L33 22 L22 30 Z" fill="#7B84E8" opacity="0.6"/>
  <path d="M11 22 L22 8 L22 30 Z" fill="#FDFCFF" opacity="0.35"/>
  <path d="M33 22 L22 8 L22 30 Z" fill="#5961CE" opacity="0.3"/>
  <path d="M6 28 L22 30 L38 28 L38 38 L6 38 Z" fill="#5961CE" opacity="0.4"/>

  <!-- Borde exterior corona — contorno nítido -->
  <path d="M6 38 L6 28 L2 14 L11 22 L22 8 L33 22 L42 14 L38 28 L38 38 Z"
        fill="none" stroke="#BAC0F2" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Banda inferior de la corona -->
  <rect x="6" y="33" width="32" height="5" rx="1"
        fill="#5961CE" opacity="0.5"/>
  <rect x="6" y="33" width="32" height="5" rx="1"
        fill="none" stroke="#BAC0F2" stroke-width="0.8"/>

  <!-- Gema central — orbe azul brillante -->
  <circle cx="22" cy="22" r="4" fill="#BAC0F2" opacity="0.9"/>
  <circle cx="22" cy="22" r="4" fill="none" stroke="#FDFCFF" stroke-width="0.8"/>
  <circle cx="20.5" cy="20.5" r="1.2" fill="#FDFCFF" opacity="0.9"/>

  <!-- Gemas laterales pequeñas -->
  <circle cx="11" cy="29" r="2.2" fill="#7B84E8" opacity="0.85"/>
  <circle cx="10.2" cy="28.2" r="0.7" fill="#FDFCFF" opacity="0.8"/>
  <circle cx="33" cy="29" r="2.2" fill="#7B84E8" opacity="0.85"/>
  <circle cx="32.2" cy="28.2" r="0.7" fill="#FDFCFF" opacity="0.8"/>

  <!-- Destellos superiores de las puntas -->
  <circle cx="22" cy="8" r="1.5" fill="#FDFCFF" opacity="0.95"/>
  <circle cx="2" cy="14" r="1.2" fill="#BAC0F2" opacity="0.8"/>
  <circle cx="42" cy="14" r="1.2" fill="#BAC0F2" opacity="0.8"/>

  <!-- Líneas de brillo diagonal — efecto vítreo -->
  <line x1="14" y1="34" x2="18" y2="38" stroke="#FDFCFF" stroke-width="0.6" opacity="0.4"/>
  <line x1="24" y1="34" x2="28" y2="38" stroke="#FDFCFF" stroke-width="0.6" opacity="0.4"/>
</svg>
